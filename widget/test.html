<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Test Page Synced</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./dist/bundle.iife.css">
  <style>
    header, main {
      margin-bottom: 20px;
      font-family: "DM Sans", sans-serif;
      font-optical-sizing: auto;
    }
    /* .wallet-adapter-button, .stake-button {
      display: inline-block;
      margin-right: 8px;
      min-width: 120px;
    } */
  </style>
</head>
<body>
  <header style="width: 100%;">
    <h2>Header</h2>
    <div style="align-items: center;text-align: center;">
      <button class="wallet-adapter-button wallet-widget-class">Wallet</button>
    </div>
    <!-- <button class="stake-button">Stake SOL</button> -->
  </header>

  <main style="text-align: center;">
    <h2>Content Area Here</h2>
    <!-- <button class="wallet-adapter-button">Wallet</button> -->
    <button class="stake-button">Stake SOL</button>
  </main>
  <footer style="text-align: center;">
    <h2>Footer</h2>
    <button class="wallet-adapter-button wallet-widget-class">Wallet</button>
  </footer>

  <script src="./dist/bundle.iife.js"></script>

  <script>
    // Wait for the bundle to load and initialize
    function initializeWidget() {
      // Give the bundle a moment to initialize
      setTimeout(() => {
        const bundle = window.WidgetBundle;
        if (!bundle) {
          console.error('WidgetBundle not found');
          return;
        }

        // Initialize the buttons
        bundle.replaceButtons();

        // Log global state periodically for debugging
        setInterval(() => {
          if (window.globalWalletState) {
            console.log('Global wallet state:', window.globalWalletState);
          }
        }, 3000);
      }, 100);
    }

    // Initialize immediately since the script is not deferred
    initializeWidget();
  </script>
</body>
</html>
