<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana Wallet Widget Test</title>
</head>
<body>
  <div style="max-width: 800px; margin: 0 auto; padding: 20px;">
    <h1>Solana Wallet Widget Demo</h1>
    <p>This is a demo page showing how to embed the Solana Wallet Widget in any website.</p>
    
    <!-- These buttons will be automatically replaced by the widget -->
    <p>Original wallet button:</p>
    <button class="wallet-adapter-button">Connect Wallet (Original)</button>
    
    <p>Another wallet button:</p>
    <button class="wallet-adapter-button">Connect Wallet (Another)</button>
    
    <!-- Debug info -->
    <div id="debug-info" style="margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px;">
      <h3>Debug Info:</h3>
      <p id="debug-text">Widget loading...</p>
    </div>
  </div>

  <!-- Solana and React CDN scripts (required for widget) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Solana Web3.js -->
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  
  <!-- Solana Wallet Adapter dependencies -->
  <script src="https://unpkg.com/@solana/wallet-adapter-base@latest/lib/index.iife.min.js"></script>
  
  <!-- Widget script (build this first with npm run build:standalone) -->
  <script src="dist/solana-widget.js"></script>
  
  <script>
    // Debug function to show widget status
    function updateDebugInfo(message) {
      document.getElementById('debug-text').textContent = message;
      console.log('[DEBUG]', message);
    }
    
    // Check if widget is available
    document.addEventListener('DOMContentLoaded', function() {
      updateDebugInfo('DOM loaded, checking for SolanaWalletWidget...');
      
      // Log what's available on window
      console.log('Window.SolanaWalletWidget:', window.SolanaWalletWidget);
      console.log('typeof window.SolanaWalletWidget:', typeof window.SolanaWalletWidget);
      
      if (window.SolanaWalletWidget) {
        updateDebugInfo('SolanaWalletWidget found and auto-initializing...');
        console.log('SolanaWalletWidget is available, initializing...');
        
        // Initialize with explicit call to ensure proper initialization
        try {
          window.SolanaWalletWidget.init({
            network: 'mainnet-beta',
            onConnect: function(publicKey) {
              updateDebugInfo('Wallet connected: ' + publicKey);
              console.log('Wallet connected with public key:', publicKey);
            },
            onDisconnect: function() {
              updateDebugInfo('Wallet disconnected');
              console.log('Wallet disconnected');
            }
          });
          
          // Replace buttons
          window.SolanaWalletWidget.replaceButtons();
          updateDebugInfo('SolanaWalletWidget initialized and buttons replaced!');
        } catch (error) {
          updateDebugInfo('Error initializing widget: ' + error.message);
          console.error('Error initializing widget:', error);
        }
      } else {
        const errorMsg = 'SolanaWalletWidget not found. Type: ' + typeof window.SolanaWalletWidget;
        updateDebugInfo(errorMsg);
        console.error(errorMsg);
      }
    });
  </script>
</body>
</html>
